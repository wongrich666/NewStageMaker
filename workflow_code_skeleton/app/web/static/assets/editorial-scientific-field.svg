    <circle cx="1496" cy="706" r="7" fill="none"/>
  </g>

  <g fill="#111" fill-opacity=".42" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1.4">
    <text x="40" y="42">SYSTEM / CELESTIAL ARCHIVE 01</text>
    <text x="274" y="728">ORBITAL REFERENCE / N 31.2304</text>
    <text x="1098" y="718">NODE 07 / WORLD DATA</text>
    <text x="1190" y="52">SECTOR 04 / LONG 121.4737</text>
    <text x="1290" y="398">PLANETARY SCAN / 0142</text>
    <text x="132" y="938">ARCHITECTURAL GRID / SCALE 1:160</text>
    <text x="1260" y="918">AI STORY RESEARCH LAB</text>
  </g>

  <g fill="#111" fill-opacity=".31">
    <circle cx="42" cy="542" r="1.4"/><circle cx="78" cy="561" r="1.1"/><circle cx="115" cy="529" r="1.6"/>
    <circle cx="612" cy="82" r="1.4"/><circle cx="674" cy="118" r="1.1"/><circle cx="716" cy="74" r="1.8"/>
    <circle cx="928" cy="648" r="1.3"/><circle cx="970" cy="684" r="1.8"/><circle cx="1036" cy="626" r="1.1"/>
    <circle cx="1514" cy="438" r="1.7"/><circle cx="1462" cy="466" r="1.2"/><circle cx="1540" cy="494" r="1.4"/>
  </g>
</svg>
