<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>登录 - 剧本生成工作台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=20260627-global-theme-v1">
  <link rel="stylesheet" href="{{ url_for('static', filename='editorial_theme.css') }}?v=20260818-scientific-editorial-v8">
</head>
<body class="workspace-body mono-page auth-page">
  <main class="chat-workspace-shell prelogin-shell">
    <aside id="workspaceCard" class="workspace-sidebar prelogin-sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand-row">
          <button class="sidebar-toggle" type="button" aria-label="折叠侧边栏">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <a class="sidebar-brand" href="{{ url_for('index') }}">
            <span class="sidebar-brand-mark"><img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Logo"></span>
            <span class="sidebar-brand-text">
              <strong>IDEA TO SCRIPT</strong>
              <em>IDEA TO SCRIPTS 智作剧本</em>
            </span>
          </a>
        </div>
      </div>

      <div class="sidebar-primary">
        <a class="sidebar-create-btn" href="{{ url_for('login_page', next=url_for('framework_planner_page', new='1')) }}">＋ 新建剧本框架</a>
        <a class="sidebar-create-btn" href="{{ url_for('login_page', next='/framework-to-script') }}">＋ 框架到剧本</a>
      </div>

      <div class="sidebar-nav">
        <section class="sidebar-group">
          <div class="sidebar-group-label">我的资产</div>
          <div class="sidebar-section-head sidebar-section-head-compact">
            <span>资产会话</span>
            <a class="sidebar-refresh-btn prelogin-inline-link" href="{{ url_for('login_page') }}">刷新</a>
          </div>
          <div class="sidebar-folders">
            <details class="workspace-folder">
              <summary>
                <span>框架资产</span>
              </summary>
              <div class="workspace-compact-list">
                <div class="workspace-empty">登录后查看 01-07 框架资产。</div>
              </div>
            </details>
            <details class="workspace-folder">
              <summary>
                <span>剧本资产</span>
              </summary>
              <div class="workspace-compact-list">
                <div class="workspace-empty">登录后查看 08-12 剧本资产。</div>
              </div>
            </details>
          </div>
        </section>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-footer-links">
          <a class="sidebar-profile-btn" href="{{ url_for('login_page') }}">
            <span class="sidebar-profile-avatar"><img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Logo"></span>
            <span class="sidebar-footer-text">登录账号</span>
          </a>
          <a class="sidebar-logout-link" href="{{ url_for('register_page') }}">注册账号</a>
        </div>
      </div>
    </aside>

    <section class="chat-main prelogin-main-shell">
      <header class="workspace-runtime runtime">
        <div class="progress-bar progress-bar-fixed runtime-progress-top">
          <div class="progress-fill" style="width: 0%;"></div>
        </div>
        <div class="runtime-strip">
          <div class="runtime-brandline">
            <span class="runtime-app-label">IDEA TO SCRIPT 智作剧本</span>
          </div>
          <div class="runtime-meta-strip">
            <div class="runtime-pill">
              <span class="runtime-kicker">状态</span>
              <strong>待登录</strong>
            </div>
            <div class="runtime-pill">
              <span class="runtime-kicker">阶段</span>
              <strong>待开始</strong>
            </div>
            <div class="runtime-pill">
              <span class="runtime-kicker">等待</span>
              <strong>00:00</strong>
            </div>
          </div>
        </div>
        <div class="runtime-foot">
          <span>0%</span>
          <span>任务：登录后开始</span>
        </div>
      </header>

      <section class="chat-view prelogin-chat-view">
        <div class="chat-transcript prelogin-transcript">
          <section class="chat-empty-state prelogin-chat-empty">
            <strong>剧本创作工作台~</strong>
            <p>登录后可新建剧本框架、导入框架生成剧本，并在左侧管理资产。</p>
          </section>
        </div>

        <div class="prelogin-auth-overlay">
          <section id="login-form" class="card auth-card prelogin-inline-auth">
            <p class="eyebrow">Welcome Back</p>
            <h2>登录工作台</h2>
            {% if error %}
              <div class="auth-error">{{ error }}</div>
            {% endif %}
            <form method="post" class="auth-form">
              <input name="next" type="hidden" value="{{ next_url or '' }}">
              <label class="field">
                <span>用户名</span>
                <input name="username" type="text" value="{{ username or '' }}" autocomplete="username" required>
              </label>
              <label class="field">
                <span>密码</span>
                <input name="password" type="password" autocomplete="current-password" required>
              </label>
              <button class="btn btn-primary" type="submit">登录</button>
            </form>
            <p class="auth-switch">还没有账号？<a href="{{ url_for('register_page') }}">注册一个</a></p>
          </section>
        </div>
      </section>

    </section>
  </main>
  <script src="{{ url_for('static', filename='theme_slideshow.js') }}?v=20260818-editorial-motion-v1"></script>
  <script src="{{ url_for('static', filename='sidebar.js') }}?v=20260612-sidebar-collapse-v1" defer></script>
</body>
</html>
