<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>登录 - 剧本创作平台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=20260713-auth-readable-v7">
</head>
<body class="auth-page-v2">

  <header class="auth-topbar">
    <a class="auth-brand" href="{{ url_for('index') }}" title="回到剧本平台首页">
      <span class="auth-brand-mark">FP</span>
      <span class="auth-brand-text">
        <strong>剧本创作平台</strong>
        <em>返回首页</em>
      </span>
    </a>
  </header>

  <main class="auth-center">
    <div class="auth-hero">
      <p class="auth-eyebrow">SCRIPT STUDIO</p>
      <h1 class="auth-title">欢迎回来</h1>
      <p class="auth-desc">登录后继续管理框架资产、爆款文审核和剧本生成任务。</p>
    </div>

    <div class="auth-card-v2">
      {% if error %}
        <div class="auth-error">{{ error }}</div>
      {% endif %}

      <form method="post" class="auth-form-v2" autocomplete="on" novalidate>
        <label class="auth-field">
          <span>用户名</span>
          <input
            name="username"
            type="text"
            value="{{ username or '' }}"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            maxlength="80"
            placeholder="输入你的用户名"
            required
          >
        </label>

        <label class="auth-field">
          <span>密码</span>
          <input
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="256"
            placeholder="输入密码"
            required
          >
        </label>

        <button class="auth-submit-btn" type="submit">
          <span>登录工作台</span>
        </button>
      </form>

      {% if registration_enabled %}
        <p class="auth-switch-v2">
          还没有账号？<a href="{{ url_for('register_page') }}">创建账号</a>
        </p>
      {% elif admin_only_login %}
        <p class="auth-switch-v2">个人专用平台，仅管理员账号可以登录</p>
      {% endif %}
    </div>

    <div class="auth-features">
      <div class="auth-feature-item">
        <span>框架资产</span>
        <small>保存 01-07 策划结果</small>
      </div>
      <div class="auth-feature-item">
        <span>剧本生成</span>
        <small>继续正文和导出</small>
      </div>
      <div class="auth-feature-item">
        <span>辅助审核</span>
        <small>运行爆款文评分</small>
      </div>
    </div>
  </main>

</body>
</html>
