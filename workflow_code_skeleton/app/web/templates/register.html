<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>注册 - 剧本创作平台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=20260708-auth-planner-light-v6">
</head>
<body class="auth-page-v2">
  <header class="auth-topbar">
    <a class="auth-brand" href="{{ url_for('index') }}" title="回到剧本平台首页">
      <span class="auth-brand-mark">FP</span>
      <span class="auth-brand-text">
        <strong>剧本创作平台</strong>
        <em>返回首页</em>
      </span>
    </a>
  </header>

  <main class="auth-center">
    <div class="auth-hero">
      <p class="auth-eyebrow">SCRIPT STUDIO</p>
      <h1 class="auth-title">创建账号</h1>
      <p class="auth-desc">注册后可以保存框架资产、继续剧本生成，并查看历史审核结果。</p>
    </div>

    <div class="auth-card-v2">
      {% if error %}
        <div class="auth-error">{{ error }}</div>
      {% endif %}

      <form method="post" class="auth-form-v2" autocomplete="on">
        <label class="auth-field">
          <span>用户名</span>
          <input
            name="username"
            type="text"
            value="{{ username or '' }}"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            maxlength="80"
            placeholder="设置登录用户名"
            required
          >
        </label>

        <label class="auth-field">
          <span>密码</span>
          <input
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="256"
            placeholder="至少 8 位密码"
            required
          >
        </label>

        <label class="auth-field">
          <span>确认密码</span>
          <input
            name="confirm_password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="256"
            placeholder="再次输入密码"
            required
          >
        </label>

        <button class="auth-submit-btn" type="submit">
          <span>注册并进入</span>
        </button>
      </form>

      <p class="auth-switch-v2">
        已有账号？<a href="{{ url_for('login_page') }}">去登录</a>
      </p>
    </div>

    <div class="auth-features">
      <div class="auth-feature-item">
        <span>新建框架</span>
        <small>从原文到策划包</small>
      </div>
      <div class="auth-feature-item">
        <span>框架到剧本</span>
        <small>继续生成正文</small>
      </div>
      <div class="auth-feature-item">
        <span>资产管理</span>
        <small>随时打开历史项目</small>
      </div>
    </div>
  </main>

</body>
</html>
