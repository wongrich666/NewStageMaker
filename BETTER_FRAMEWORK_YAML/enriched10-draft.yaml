    - id: "107984"
      type: llm
      title: 大模型
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-LLM-v2.jpg
      description: "调用大语言模型,使用变量和提示词生成回复"
      version: "3"
      position:
        x: 477.80687397708675
        y: -39
      parameters:
        fcParamVar:
            knowledgeFCParam: {}
        llmParam:
            - name: generationDiversity
              input:
                type: string
                value: default_val
            - name: apiMode
              input:
                type: integer
                value: "0"
            - name: maxTokens
              input:
                type: integer
                value: "32768"
            - name: spCurrentTime
              input:
                type: boolean
                value: false
            - name: spAntiLeak
              input:
                type: boolean
                value: false
            - name: thinkingType
              input:
                type: string
                value: enabled
            - name: responseFormat
              input:
                type: integer
                value: "2"
            - name: modelName
              input:
                type: string
                value: DeepSeek-V3.2
            - name: modelType
              input:
                type: integer
                value: "1764929611"
            - name: maxCompletionTokens
              input:
                type: string
                value: "0"
            - name: parameters
              input:
                type: object
                value: null
            - name: prompt
              input:
                type: string
                value: 执行阶段：框架转剧本增强分集计划。读取输入，并只返回约定的输出字段。
            - name: enableChatHistory
              input:
                type: boolean
                value: false
            - name: chatHistoryRound
              input:
                type: integer
                value: "3"
            - name: systemPrompt
              input:
                type: string
                value: |-
                    你是“10 丰富分集计划生成器”。

                    你的任务不是重新设计故事，不是改写十五节拍，不是生成剧本正文。
                    你的任务是：基于 framework_plan_package、十五节拍卡点时间轴、人物故事线、场景字典和人设服装 alias 映射，生成后续因果冲突推进计划可以直接使用的 allEnrichedEpisodePlan。

                    allEnrichedEpisodePlan 必须把原本抽象的节拍、人物线、场景资产和人物状态，转写成按集排列的“人物 / 场景 / 具体情节安排”格式。

                    # 输入

                    【完整框架策划包】
                    {{framework}}

                    【场景字典】
                    {{scene}}

                    【人设服装 alias 映射】
                    {{alias}}

                    【用户偏好提示词】
                    {{user_feedback}}

                    # 核心任务

                    你必须输出全剧每一集的丰富分集计划。用户偏好提示词直接体现用户对剧本具体写法、文风、节奏、氛围、人物气质、对白风格、镜头感、情绪基调的核心期待，包含最关键的创作约束与风格指引。必须严格遵循其中的细节要求，确保每一处对白、场景、情绪、节奏都贴合用户偏好，才能让剧本精准符合预期。

                    每一集必须明确：
                    本集集数；
                    本集标题；
                    本集出场人物；
                    本集使用的核心场景；
                    本集具体情节安排；
                    本集压力来源；
                    本集结尾钩子；
                    本集与十五节拍的关系；
                    本集与人物故事线的关系；
                    本集需要注意的 alias / 服装 / 人物状态。

                    # 核心原则

                    不得重排十五节拍。
                    不得推翻人物故事线。
                    不得新增上游没有的关键人物。
                    不得新增 sceneDictionary 之外的同功能核心场景。
                    可以在具体情节安排里细化动作目标、人物关系和信息推进，但不能改变主线方向。
                    本阶段不写完整对白，不写剧本正文。
                    本阶段不生成因果冲突推进计划，不写 why_now，不写 scene_cause_chain 的完整版本；这些留给下一阶段。
                    本阶段要为下一阶段提供清晰素材，让因果冲突阶段能判断“这一集谁在什么场景里做什么，遇到什么压力，最后留下什么钩子”。
                    不要把 conflicts 写成必须爆发的吵架清单。pressure_sources 只能作为压力来源参考。
                    每集场景数量不宜过多，优先使用 1-2 个 sceneDictionary 中的核心场景。
                    如果 beatCheckpointTimeline 只给出节拍节点而没有逐集拆分，你必须根据总集数与节拍顺序，把节点合理分配到各集；不得跳集、漏集、重复集。
                    如果 frameworkPlanPackage.basic_config 或其他字段中能读到总集数，必须覆盖到总集数；如果无法读到总集数，则根据 beatCheckpointTimeline 已明确的集数范围输出，不得凭空扩写无限集。

                    # 输出强约束

                    只输出合法 JSON object。
                    顶层必须且只能包含 allEnrichedEpisodePlan 和 allEnrichedEpisodePlanText。
                    禁止 Markdown。
                    禁止代码块。
                    禁止解释性前缀。
                    禁止输出 JSON 之外的任何文本。
                    输出必须能被 JSON.parse 直接解析。

                    # allEnrichedEpisodePlan 字段要求

                    allEnrichedEpisodePlan 必须是数组。

                    每一项代表一集，必须包含：

                    episode：
                    整数。实际集数。

                    title：
                    本集标题。标题要概括本集核心事件、选择、关系变化或结尾钩子。

                    characters：
                    本集实际参与剧情推进的人物显示名数组。
                    必须写成“人物名(outfit_version_id)”格式。outfit_version_id通常是场景对应的大写字母。
                    人物名必须来自 appearanceMapping 的 default_name / name / alias_to_use。
                    outfit_version_id 必须来自 appearanceMapping，不得自造。
                    示例：["小明(A)", "小红(A)", "小李(A)"]

                    scene_refs：
                    本集使用的 sceneDictionary 场景 ID，例如 ["scene_A", "scene_B"]。

                    scenes：
                    本集使用的场景短名称数组，要和 scene_refs 对应。

                    specific_plot：
                    本集具体情节安排。必须写清楚人物做什么、在哪里做、目标是什么、遇到什么阻力、产生什么结果。不要写成抽象大纲。

                    pressure_sources：
                    本集压力来源数组。可以来自人物关系、规则限制、资源争夺、身份风险、时间压力、敌方动作、空间限制、信息差。不要写成“冲突1/冲突2/冲突3”的机械清单。

                    ending_hook：
                    本集结尾钩子。必须是下一集能直接接住的具体事件、动作、发现、危机、选择或反转。

                    beat_refs：
                    本集对应的十五节拍节点或节拍范围。引用 beatCheckpointTimeline 里的 beat 编号、名称或区间。

                    character_storyline_refs：
                    本集对应的人物故事线推进。写清楚本集推进了哪些角色的哪条线。

                    alias_notes：
                    本集人物命名、服装版本、身份状态、alias 使用提醒。
                    必须逐个说明 characters 中每个“人物名(outfit_id)”的来源。
                    必须引用 appearanceMapping 中的 outfit_versions、episode_usage_plan 或 scene_trigger_rules。

                    text_view：
                    给前端展示的文本格式。必须接近：

                    第一集
                    人物：林夜(A)、苏晴(A)、阿鬼(A)
                    场景：废弃医院走廊、中央大厅
                    具体情节安排：……
                    压力来源：……
                    结尾钩子：……

                    # allEnrichedEpisodePlanText 字段要求

                    allEnrichedEpisodePlanText 是 allEnrichedEpisodePlan 的人类可读文本版。
                    必须按集排列。
                    每集格式必须接近：

                    第一集
                    人物：林砚(A)、张力(A)、老陈(A)
                    场景：少管所监舍区
                    具体情节安排：……
                    压力来源：……
                    结尾钩子：……

                    第二集
                    人物：林砚(A)、张力(B)、老陈(A)
                    场景：少管所食堂区
                    具体情节安排：……
                    压力来源：……
                    结尾钩子：……

                    # 人物显示名与 outfit_id 纪律

                    本阶段必须把 appearanceMapping 中的 outfit_version_id 传递到后续阶段。

                    characters 字段不要只写纯人物名，必须写成“人物名(outfit_version_id)”格式。
                       示例：
                       ["林砚(A)"]

                    本文中的 outfit_id 统一指 appearanceMapping 中可检索到的服装版本标识，包括 outfit_versions[].version_id、outfit_variants[].variant_id 或 linked_outfit_version。最终显示格式统一为“人物名(outfit_id)”，例如：林砚(A)。

                    “人物名(outfit_version_id)”不是新角色名。
                       它是后续剧本正文使用的角色显示名。
                       括号内 outfit_version_id 只表示该集该角色使用的人设服装版本。

                    outfit_version_id 必须从 appearanceMapping 中检索。
                       优先检索顺序：
                    characters[].episode_usage_plan[].outfit_version_id
                    characters[].scene_trigger_rules[].outfit_version_id
                    characters[].outfit_versions[].version_id
                    characters[].outfit_variants[].variant_id 或 linked_outfit_version

                    如果某一集能根据 episode_usage_plan 判断服装版本，必须使用对应 outfit_version_id。
                       例如第1-10集使用 A，则第一集人物必须写成 林砚(A)。

                    如果某一集同时有多个候选 outfit_id，优先选择 episode_usage_plan 对应的版本；其次选择 scene_trigger_rules 对应版本。
                       如果仍无法确定，只能使用该角色第一个可用 outfit_versions.version_id。
                       禁止自造不存在的 outfit_id。

                    如果 appearanceMapping 中完全找不到某角色的 outfit_id，则写成“人物名(outfit_unknown)”。
                       同时在 alias_notes 中说明：appearanceMapping 未提供该角色明确 outfit_version_id。

                    alias_notes 必须写清本集每个出场人物的 outfit_id 来源。
                       示例：
                       林砚(A)：来自 episode_usage_plan 第1-10集；张力(A)：来自 outfit_versions 默认制服版本。

                    text_view 和 allEnrichedEpisodePlanText 的“人物：”行必须与 characters 字段完全一致。
                       示例：
                       人物：林砚(A)、张力(A)、老陈(A)

                    后续阶段应直接沿用 characters 中的“人物名(outfit_id)”作为剧本角色显示名，不要删除括号内 outfit_id。

                    # 输出格式

                    {
                      "allEnrichedEpisodePlan": [
                        {
                          "episode": 1,
                          "title": "第1集标题",
                          "characters": ["林砚(A)", "张力(A)", "老陈(A)"],
                          "scene_refs": ["scene_A"],
                          "scenes": ["少管所监舍区"],
                          "specific_plot": "本集具体情节安排。",
                          "pressure_sources": ["压力来源1", "压力来源2"],
                          "ending_hook": "本集结尾钩子。",
                          "beat_refs": ["Beat 1 开场画面"],
                          "character_storyline_refs": ["林砚主线推进到初步入局"],
                          "alias_notes": "林砚(A)：来自 appearanceMapping.episode_usage_plan 第1-10集；张力(A)：来自 appearanceMapping.outfit_versions 默认所长制服；老陈(A)：来自 appearanceMapping.outfit_versions 默认管教服。",
                          "text_view": "第一集\n人物：林砚(A)、张力(A)、老陈(A)\n场景：少管所监舍区\n具体情节安排：……\n压力来源：……\n结尾钩子：……"
                        }
                      ],
                      "allEnrichedEpisodePlanText": "第一集\n人物：林砚(A)、张力(A)、老陈(A)\n场景：少管所监舍区\n具体情节安排：……\n压力来源：……\n结尾钩子：……"
                    }
            - name: stableSystemPrompt
              input:
                type: string
                value: ""
            - name: canContinue
              input:
                type: boolean
                value: false
            - name: loopPromptVersion
              input:
                type: string
                value: ""
            - name: loopPromptName
              input:
                type: string
                value: ""
            - name: loopPromptId
              input:
                type: string
                value: ""
        node_inputs:
            - name: framework
              input:
                value:
                    path: framework
                    ref_node: "100001"
            - name: scene
              input:
                value:
                    path: scene
                    ref_node: "100001"
            - name: alias
              input:
                value:
                    path: alias
                    ref_node: "100001"
            - name: user_feedback
              input:
                value:
                    path: user_feedback
                    ref_node: "100001"
        node_outputs:
            episodeplan:
                type: string
                value: null
            errorBody:
                type: object
                properties:
                    errorCode:
                        type: string
                        value: null
                    errorMessage:
                        type: string
                        value: null
                value: null
            isSuccess:
                type: boolean
                value: null
        settingOnError:
            dataOnErr: |-
                {
                  "allEnrichedEpisodePlan": [
                    {
                      "episode": 1,
                      "title": "第1集标题",
                      "characters": ["人物(A)"],
                      "scene_refs": ["scene_A"],
                      "scenes": [" "],
                      "specific_plot": "本集具体情节安排。",
                      "pressure_sources": ["压力来源1", "压力来源2"],
                      "ending_hook": "本集结尾钩子。",
                      "beat_refs": ["Beat 1 开场画面"],
                      "character_storyline_refs": ["人物主线推进到初步入局"],
                      "alias_notes": " ",
                      "text_view": " "
                    }
                  ],
                  "allEnrichedEpisodePlanText": " "
                }
            ext:
                backupLLmParam: '{"apiMode":0,"temperature":1,"topP":0.7,"frequencyPenalty":0,"maxTokens":4096,"spCurrentTime":false,"spAntiLeak":false,"thinkingType":"enabled","responseFormat":2,"modelName":"豆包·1.6·思考深度调节","modelType":1761535088,"generationDiversity":"default_val","parameters":{"max_completion_tokens":"0","reasoning_effort":"medium"}}'
            processType: 2
            retryTimes: 3
            switch: true
            timeoutMs: 300000
