                                "use_alias": "此场景推荐使用的 alias",
                                "outfit_version_id": "outfit_A",
                                "behavior_notes": "该角色在此场景中的行动、站位、风险或关系状态注意事项"
                              }
                            ],
                            "episode_usage_plan": [
                              {
                                "episode_range": "第1集 / 第1-3集 / 第2集后半段",
                                "presence_state": "正面出场/隐藏出场/只作为线索/不出场",
                                "outfit_version_id": "outfit_A",
                                "alias_to_use": "该阶段应使用的角色名或 alias",
                                "relationship_state": "该阶段主要关系状态",
